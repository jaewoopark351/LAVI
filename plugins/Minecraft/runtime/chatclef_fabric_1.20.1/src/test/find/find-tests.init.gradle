//20260914_kpopmodder: Compile FIND and its existing ownership/diagnostic regressions on the 1.20.1 project only.
gradle.projectsEvaluated {
    def target = gradle.rootProject.findProject(':1.20.1')
    if (target == null) throw new GradleException('Missing approved 1.20.1 project')
    def patterns = [
        'lavi/minecraft/find/**',
        'lavi/minecraft/integration/input/lease/**',
        'lavi/minecraft/integration/lifecycle/root/**',
        'lavi/minecraft/fabric/chatclef/bridge/command/result/find/**',
        'lavi/minecraft/fabric/chatclef/bridge/command/admission/find/**',
        'lavi/minecraft/fabric/chatclef/bridge/transport/find/**',
        'lavi/minecraft/fabric/chatclef/bridge/command/control/stop/**',
        'lavi/minecraft/fabric/chatclef/bridge/command/lifecycle/root/**',
        'lavi/minecraft/fabric/chatclef/bridge/command/FabricChatClefBoundRootDetachOwnershipTest.java',
        'lavi/minecraft/fabric/chatclef/bridge/command/FabricChatClefRootOwnershipClassifierTest.java',
        'lavi/minecraft/fabric/chatclef/bridge/command/lifecycle/FabricChatClefTaskFinishedEventAssociationTest.java',
        'lavi/minecraft/fabric/chatclef/bridge/command/execution/FabricChatClefRootTerminationIntegrationTest.java',
        'lavi/minecraft/diagnostics/session/**',
        'lavi/minecraft/testsupport/**'
    ]
    def selected = target.fileTree(gradle.rootProject.file('src/test/java')) { include patterns }
    // Reuse the existing exact named-registry test agent and explicit Jupiter runner; no gameplay/dependency changes.
    def runner = gradle.rootProject.file('src/test/goldMining/java/lavi/minecraft/test/GoldFocusedTestRunner.java')
    def output = new File(target.layout.buildDirectory.get().asFile, 'find-focused/classes')
    def agentOutput = new File(target.layout.buildDirectory.get().asFile, 'find-focused/bootstrap-classes')
    def agentDirectory = new File(target.layout.buildDirectory.get().asFile, 'find-focused/bootstrap-agent')
    def agentSources = gradle.rootProject.fileTree('src/test/autoDeposit/java') { include '**/*.java' }
    target.tasks.register('findCompileBootstrapAgent', JavaCompile) {
        source agentSources
        classpath = target.files(target.configurations.testRuntimeClasspath.files)
        destinationDirectory.set(agentOutput)
        options.release.set(17)
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-proc:none', '-implicit:none']
    }
    def agentJar = target.tasks.register('findBootstrapAgentJar', Jar) {
        dependsOn target.tasks.named('findCompileBootstrapAgent')
        from agentOutput
        archiveFileName.set('find-named-registry-test-agent.jar')
        destinationDirectory.set(agentDirectory)
        manifest { attributes 'Premain-Class': 'lavi.minecraft.test.bootstrap.NamedRegistryAccessAgent' }
    }
    target.tasks.register('findVerifyMinecraftBootstrap', JavaExec) {
        dependsOn agentJar
        classpath = target.files(agentOutput, target.configurations.testRuntimeClasspath.files)
        mainClass.set('lavi.minecraft.test.bootstrap.MinecraftBootstrapProbe')
        systemProperty 'user.dir', gradle.rootProject.projectDir.absolutePath
        def bootstrapTemp = new File(target.layout.buildDirectory.get().asFile, 'find-test-temp/bootstrap')
        systemProperty 'java.io.tmpdir', bootstrapTemp.absolutePath
        doFirst {
            bootstrapTemp.mkdirs()
            jvmArgs '-javaagent:' + agentJar.get().archiveFile.get().asFile.absolutePath
        }
    }
    target.tasks.register('findCompileTests', JavaCompile) {
        dependsOn target.tasks.named('compileJava'), target.tasks.named('processResources')
        source selected, runner
        classpath = target.files(target.sourceSets.main.output.classesDirs.files,
                target.sourceSets.main.output.resourcesDir, target.configurations.testCompileClasspath.files,
                target.configurations.testRuntimeClasspath.files)
        destinationDirectory.set(output)
        options.release.set(17)
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-proc:none', '-implicit:none']
    }
    target.tasks.register('findFocusedTests', JavaExec) {
        dependsOn target.tasks.named('findCompileTests'), target.tasks.named('findVerifyMinecraftBootstrap')
        classpath = target.files(output, target.sourceSets.main.output.classesDirs.files,
                target.sourceSets.main.output.resourcesDir, target.configurations.testRuntimeClasspath.files)
        mainClass.set('lavi.minecraft.test.GoldFocusedTestRunner')
        systemProperty 'user.dir', gradle.rootProject.projectDir.absolutePath
        def isolatedTemp = new File(target.layout.buildDirectory.get().asFile, 'find-test-temp')
        systemProperty 'java.io.tmpdir', isolatedTemp.absolutePath
        doFirst {
            isolatedTemp.mkdirs()
            jvmArgs '-javaagent:' + agentJar.get().archiveFile.get().asFile.absolutePath
            def names = selected.files.findAll { it.name ==~ /.*Tests?\.java/ }.collect { source ->
                def match = source.getText('UTF-8') =~ /(?m)^package\s+([^;]+);/
                if (!match.find()) throw new GradleException('Missing test package: ' + source)
                match.group(1) + '.' + source.name.replaceFirst(/\.java$/, '')
            }.unique().sort()
            if (names.empty) throw new GradleException('No FIND/ownership/diagnostic tests selected')
            args names
        }
    }
}
