//20260915_kpopmodder: Reuse the strict Jupiter runner and existing named-registry bootstrap for this bounded change.
gradle.projectsEvaluated {
    def target = gradle.rootProject.findProject(':1.20.1')
    if (target == null) throw new GradleException('Missing approved 1.20.1 project')
    def selected = target.fileTree(gradle.rootProject.file('src/test/java')) {
        include 'lavi/minecraft/command/attack/**'
        include 'lavi/minecraft/command/result/instant/**'
        include 'lavi/minecraft/fabric/chatclef/bridge/catalogue/**'
        include 'lavi/minecraft/fabric/chatclef/bridge/command/FabricChatClefInstant*Test.java'
        include 'lavi/minecraft/fabric/chatclef/bridge/command/FabricChatClefCommandOutcomeClassifierTest.java'
        include 'lavi/minecraft/fabric/chatclef/bridge/command/result/effect/equip/**'
        include 'lavi/minecraft/fabric/chatclef/bridge/command/execution/EquipEffectExecutionFixture.java'
        include 'lavi/minecraft/testsupport/**'
    }
    def runner = gradle.rootProject.file('src/test/goldMining/java/lavi/minecraft/test/GoldFocusedTestRunner.java')
    def output = new File(target.layout.buildDirectory.get().asFile, 'all-commands-focused/classes')
    target.tasks.register('allCommandsCompileTests', JavaCompile) {
        dependsOn target.tasks.named('compileJava'), target.tasks.named('processResources')
        source selected, runner
        classpath = target.files(target.sourceSets.main.output.classesDirs.files,
                target.sourceSets.main.output.resourcesDir, target.configurations.testCompileClasspath.files,
                target.configurations.testRuntimeClasspath.files)
        destinationDirectory.set(output)
        options.release.set(17)
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-proc:none', '-implicit:none']
    }
    target.tasks.register('allCommandsFocusedTests', JavaExec) {
        dependsOn target.tasks.named('allCommandsCompileTests'), target.tasks.named('autoDepositVerifyMinecraftBootstrap')
        classpath = target.files(output, target.sourceSets.main.output.classesDirs.files,
                target.sourceSets.main.output.resourcesDir, target.configurations.testRuntimeClasspath.files)
        mainClass.set('lavi.minecraft.test.GoldFocusedTestRunner')
        systemProperty 'user.dir', gradle.rootProject.projectDir.absolutePath
        def isolatedTemp = new File(target.layout.buildDirectory.get().asFile, 'all-commands-focused/tmp')
        systemProperty 'java.io.tmpdir', isolatedTemp.absolutePath
        if (target.hasProperty('allCommandsKoreanLanguageFile')) systemProperty 'allCommands.koreanLanguageFile', target.property('allCommandsKoreanLanguageFile')
        if (target.hasProperty('allCommandsCatalogueOutput')) systemProperty 'allCommands.catalogueOutput', target.property('allCommandsCatalogueOutput')
        if (target.hasProperty('allCommandsEquipEvidenceOutput')) systemProperty 'allCommands.equipEvidenceOutput', target.property('allCommandsEquipEvidenceOutput')
        doFirst {
            isolatedTemp.mkdirs()
            def agent = target.tasks.named('autoDepositBootstrapAgentJar').get().archiveFile.get().asFile
            jvmArgs '-javaagent:' + agent.absolutePath
            def names = selected.files.findAll { it.name ==~ /.*Tests?\.java/ }.collect { source ->
                def match = source.getText('UTF-8') =~ /(?m)^package\s+([^;]+);/
                if (!match.find()) throw new GradleException('Missing test package: ' + source)
                match.group(1) + '.' + source.name.replaceFirst(/\.java$/, '')
            }.unique().sort()
            if (names.empty) throw new GradleException('No all-command tests selected')
            args names
        }
    }
}
